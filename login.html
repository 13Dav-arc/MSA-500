<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | MindStormer Academy</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    /* Disable native browser password reveal & autofill icons across all browsers */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear,
    input[type="password"]::-webkit-contacts-auto-fill-button,
    input[type="password"]::-webkit-credentials-auto-fill-button {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      position: absolute !important;
      right: 0 !important;
      width: 0 !important;
      height: 0 !important;
    }
    .card-enterprise { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05); }
    .btn-enterprise-primary { background-color: #1D4ED8; color: #FFFFFF; border-radius: 0.75rem; font-weight: 700; letter-spacing: 0.02em; transition: all 0.15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; }
    .btn-enterprise-primary:hover { background-color: #1E40AF; box-shadow: 0 4px 6px -1px rgba(29, 78, 216, 0.2); }
    .btn-enterprise-primary:focus-visible, .msa-form input:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid #1D4ED8 !important; outline-offset: 2px !important; }
    .msa-form label { display: block; font-size: 0.75rem; font-weight: 700; color: #334155; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.375rem; }
    .msa-form input[type="text"], .msa-form input[type="password"] { width: 100%; min-height: 48px; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid #CBD5E1; font-size: 1rem; font-weight: 500; color: #0F172A; background-color: #FFFFFF; outline: none; transition: all 0.2s ease; }
    @media (min-width: 640px) { .msa-form input[type="text"], .msa-form input[type="password"] { font-size: 0.875rem; } }
    .msa-form input:focus { border-color: #1D4ED8; box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15); }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-[100dvh] overflow-x-hidden flex flex-col justify-between">

  <!-- WCAG 2.1 AA Skip to Main Content Bypass Link -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:bg-[#1D4ED8] focus:text-white focus:px-4 focus:py-2 focus:rounded-lg focus:font-bold focus:shadow-lg focus:outline-none">Skip to main content</a>

  <!-- Header Navigation -->
  <header role="banner" class="bg-white border-b border-slate-200 py-3.5 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3 focus:outline-none focus-visible:rounded-lg min-h-[48px]" aria-label="MindStormer Global Academy Home">
        <div class="w-10 h-10 bg-[#0F172A] rounded-xl flex items-center justify-center text-white font-black text-base border border-slate-700 shadow-sm flex-shrink-0">MS</div>
        <div class="flex flex-col">
          <span class="text-sm sm:text-base font-black tracking-tight text-slate-900 leading-none whitespace-nowrap font-heading">MAYND STORMIR</span>
          <span class="text-[10px] font-bold text-blue-700 tracking-wider leading-tight uppercase">ACADEMY</span>
        </div>
      </a>
      <a href="parent-login.html" class="text-xs font-bold text-slate-700 hover:text-[#1D4ED8] transition-colors focus-visible:rounded px-2 py-1 min-h-[48px] inline-flex items-center">Guardian Portal →</a>
    </div>
  </header>

  <!-- Login Form Card -->
  <main id="main-content" role="main" class="flex-1 flex items-center justify-center p-4 py-8">
    <div class="msa-login-card card-enterprise w-full max-w-md bg-white rounded-2xl p-4 sm:p-6 md:p-8 lg:p-10">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-blue-50 text-[#1D4ED8] rounded-xl font-bold mb-3 shadow-sm" aria-hidden="true">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          </svg>
        </div>
        <h1 class="text-2xl font-black text-[#0F172A] tracking-tight font-heading">Student Portal Login</h1>
        <p class="text-xs font-medium text-slate-600 mt-1">Enter your student credentials to access active modules</p>
      </div>

      <form action="dashboard.html" method="get" id="login" name="login" class="space-y-4 msa-form" novalidate>
        <div>
          <label for="username">Student Username or Email</label>
          <input type="text" id="username" name="username" value="student_g2" placeholder="e.g. student_g2" autocomplete="username" required aria-required="true">
        </div>

        <div class="relative">
          <label for="password">Password</label>
          <div class="relative w-full flex items-center">
            <input 
              type="password" 
              id="password" 
              name="password" 
              value="Stormer@2026" 
              placeholder="••••••••" 
              autocomplete="current-password" 
              required 
              aria-required="true"
              class="w-full pr-12 py-2.5 sm:py-3.5 px-4 rounded-xl border border-slate-300 text-base sm:text-sm text-slate-900 focus:outline-none focus:border-blue-600 transition-colors"
            >
            <button 
              type="button" 
              data-pw-toggle="password" 
              aria-label="Toggle password visibility" 
              aria-pressed="false" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 bg-transparent border-0 p-1.5 inline-flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 rounded-lg cursor-pointer z-10"
            >
              <!-- Eye Open Icon (Visible by default) -->
              <svg class="pw-eye-open w-5 h-5 block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye Slash Icon (Hidden by default) -->
              <svg class="pw-eye-slash w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginbtn" class="w-full btn-enterprise-primary text-white font-bold py-2.5 sm:py-3.5 px-4 min-h-[44px] sm:min-h-[48px] text-xs sm:text-sm uppercase tracking-wider rounded-xl transition-all cursor-pointer">
          Sign In to Student Portal
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-xs font-semibold text-slate-600">
        <div><a href="#" class="text-slate-600 hover:text-[#1D4ED8] hover:underline focus-visible:rounded px-1">Forgot password?</a></div>
        <div><a href="signup.html" class="text-[#1D4ED8] hover:text-[#1E40AF] hover:underline focus-visible:rounded px-1">Register Student Account</a></div>
      </div>
    </div>
  </main>

  <footer role="contentinfo" class="w-full bg-[#0F172A] text-slate-400 text-center text-xs py-4 border-t border-slate-800 mt-auto">
    © 2026 Maynd Stormir Inc. All rights reserved.
  </footer>

  <script src="assets/js/form-validation.js" defer></script>
</body>
</html>
