<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | MindStormer Global Academy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { heading: ['Plus Jakarta Sans', 'sans-serif'], body: ['Inter', 'sans-serif'] },
          colors: { msa: { navy: '#0F172A', royal: '#1E3A8A', blue: '#2563EB', emerald: '#10B981', amber: '#F59E0B' } }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; }
    .btn-3d-blue { background-color: #2563EB; box-shadow: 0 4px 0 #1D4ED8; transition: all 0.2s ease; }
    .btn-3d-blue:hover { background-color: #1D4ED8; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(37,99,235,0.3), 0 4px 0 #1E40AF; }
    .btn-3d-blue:active { transform: translateY(2px); box-shadow: 0 2px 0 #1E40AF; }
    .btn-3d-blue:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible,
    button:focus-visible {
      outline: 3px solid #2563EB !important;
      outline-offset: 2px !important;
    }
    .card-tactile { background: #FFFFFF; border: 2px solid #E2E8F0; border-bottom-width: 5px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <header role="banner" class="bg-white border-b-2 border-slate-100 py-4 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3" aria-label="MindStormer Global Academy Home">
        <div class="w-10 h-10 bg-gradient-to-br from-msa-navy to-blue-900 rounded-xl flex items-center justify-center text-white font-black text-lg border border-blue-500/20 shadow-sm">MS</div>
        <span class="font-black text-base text-msa-navy">MAYND STORMIR <span class="text-msa-blue">ACADEMY</span></span>
      </a>
      <a href="login.html" class="text-xs font-bold text-slate-700 hover:text-msa-blue transition-colors focus-visible:rounded px-2 py-1">Already registered? Log in →</a>
    </div>
  </header>

  <main role="main" class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-lg card-tactile rounded-2xl p-8 shadow-xl">
      <div class="text-center mb-8">
        <div class="inline-flex p-3 bg-emerald-50 text-emerald-600 rounded-xl font-bold text-2xl mb-3 shadow-inner" aria-hidden="true">📝</div>
        <h1 class="text-2xl font-black text-msa-navy">Register Student Account</h1>
        <p class="text-xs font-medium text-slate-600 mt-1">Select your grade level to start your learning track</p>
      </div>

      <form action="dashboard.html" method="GET" class="space-y-4" novalidate>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="student_firstname" class="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">First Name</label>
            <input type="text" id="student_firstname" name="firstname" required aria-required="true" placeholder="Alex" autocomplete="given-name" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-800 focus:border-msa-blue focus:outline-none">
          </div>
          <div>
            <label for="student_lastname" class="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Last Name</label>
            <input type="text" id="student_lastname" name="lastname" required aria-required="true" placeholder="O." autocomplete="family-name" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-800 focus:border-msa-blue focus:outline-none">
          </div>
        </div>

        <div>
          <label for="student_email" class="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Student Email Address</label>
          <input type="email" id="student_email" name="email" required aria-required="true" placeholder="alex.o@mindstormer.com" autocomplete="email" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-800 focus:border-msa-blue focus:outline-none">
        </div>

        <div>
          <label for="student_grade" class="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Grade Level Track</label>
          <select id="student_grade" name="grade" required aria-required="true" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-800 focus:border-msa-blue focus:outline-none bg-white cursor-pointer">
            <optgroup label="Foundational Tier (Ages 5–8)">
              <option value="g1">Grade 1 (Foundational)</option>
              <option value="g2">Grade 2 (Foundational)</option>
              <option value="g3">Grade 3 (Foundational)</option>
            </optgroup>
            <optgroup label="Intermediate Tier (Ages 9–11)">
              <option value="g4">Grade 4 (Intermediate)</option>
              <option value="g5">Grade 5 (Intermediate)</option>
              <option value="g6">Grade 6 (Intermediate)</option>
            </optgroup>
            <optgroup label="Junior Secondary Tier (Ages 12–14)">
              <option value="g7" selected>Grade 7 (Junior Secondary 1)</option>
              <option value="g8">Grade 8 (Junior Secondary 2)</option>
              <option value="g9">Grade 9 (Junior Secondary 3)</option>
            </optgroup>
          </select>
        </div>

        <div class="relative">
          <label for="student_password" class="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Password</label>
          <div class="relative">
            <input type="password" id="student_password" name="password" required aria-required="true" aria-describedby="password-rules" placeholder="Minimum 8 characters" autocomplete="new-password" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-800 focus:border-msa-blue focus:outline-none pr-11">
            <button type="button" data-toggle-password="student_password" aria-label="Show password" aria-pressed="false" class="absolute right-3 top-[8px] text-slate-500 hover:text-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 rounded-lg p-1.5 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>

          <!-- Dynamic Real-Time Password Checklist -->
          <div id="password-rules" role="region" aria-label="Password Requirements" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2.5" aria-live="polite">
            <div id="rule-length" class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-bold border border-slate-200 transition-colors">
              <span class="status-icon" aria-hidden="true">○</span> <span>8+ Chars</span>
            </div>
            <div id="rule-upper" class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-bold border border-slate-200 transition-colors">
              <span class="status-icon" aria-hidden="true">○</span> <span>1 Upper</span>
            </div>
            <div id="rule-num" class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-bold border border-slate-200 transition-colors">
              <span class="status-icon" aria-hidden="true">○</span> <span>1 Number</span>
            </div>
            <div id="rule-spec" class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-bold border border-slate-200 transition-colors">
              <span class="status-icon" aria-hidden="true">○</span> <span>1 Symbol</span>
            </div>
          </div>
        </div>

        <button type="submit" class="w-full btn-3d-blue text-white font-black py-3.5 rounded-xl text-sm uppercase tracking-wider mt-2 cursor-pointer">
          Create Student Account 🚀
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs font-bold text-slate-600">
        Parent or Guardian? <a href="parent-signup.html" class="text-emerald-700 hover:underline focus-visible:rounded px-1">Register via Guardian Portal</a>
      </div>
    </div>
  </main>

  <footer role="contentinfo" class="bg-slate-900 text-slate-400 text-center text-xs py-4">
    © 2026 Maynd Stormir Inc. All rights reserved.
  </footer>

  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/form-validation.js" defer></script>
</body>
</html>
