name: Deploy MSA-500 Enterprise Theme to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 [1/5] Navigating to MSA workspace..."
            cd /var/www/msa

            echo "📥 [2/5] Forcing clean pull from origin/main (preserving runtime data)..."
            git fetch --all
            git reset --hard origin/main
            git clean -fd -e moodledata -e moodle/config.php

            echo "📁 [3/5] Ensuring theme target directories exist..."
            sudo mkdir -p moodle/theme/boost/templates
            sudo mkdir -p moodle/theme/boost/style
            sudo mkdir -p moodle/theme/boost/javascript

            echo "🔄 [4/5] Synchronizing Mustache templates and styles..."
            # Sync templates from theme/boost/templates/ directly to moodle root
            sudo rsync -av --delete theme/boost/templates/ moodle/theme/boost/templates/

            # Sync compiled enterprise CSS
            if [ -f "assets/css/main.css" ]; then
              sudo cp assets/css/main.css moodle/theme/boost/style/moodle.css
            fi

            # Sync form-validation script directly to theme javascript directory
            if [ -f "theme/boost/javascript/form-validation.js" ]; then
              sudo cp theme/boost/javascript/form-validation.js moodle/theme/boost/javascript/form-validation.js
            fi

            echo "🔒 [5/5] Setting atomic ownership & permissions and purging cache..."
            sudo chown -R www-data:www-data moodle/theme/boost/
            sudo find moodle/theme/boost/ -type d -exec chmod 755 {} +
            sudo find moodle/theme/boost/ -type f -exec chmod 644 {} +

            # Purge Moodle theme cache as www-data
            sudo -u www-data php moodle/admin/cli/purge_caches.php

            echo "✅ Deployment completed successfully!"
