<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian Login | MindStormer Academy</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    .card-enterprise { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05); }
    .btn-enterprise-emerald { background-color: #047857; color: #FFFFFF; border-radius: 0.625rem; font-weight: 700; font-size: 0.875rem; letter-spacing: 0.02em; transition: all 0.15s ease; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; }
    .btn-enterprise-emerald:hover { background-color: #065F46; box-shadow: 0 4px 6px -1px rgba(4, 120, 87, 0.2); }
    .btn-enterprise-emerald:focus-visible, .msa-parent-form input:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid #047857 !important; outline-offset: 2px !important; }
    .msa-parent-form label { display: block; font-size: 0.75rem; font-weight: 700; color: #334155; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.375rem; }
    .msa-parent-form input[type="text"], .msa-parent-form input[type="password"] { width: 100%; padding: 0.75rem 1rem; border-radius: 0.625rem; border: 1px solid #CBD5E1; font-size: 0.875rem; font-weight: 500; color: #0F172A; background-color: #FFFFFF; outline: none; transition: all 0.2s ease; }
    .msa-parent-form input:focus { border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.15); }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Guardian Header Landmark -->
  <header role="banner" class="bg-white border-b border-slate-200 py-4 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3 focus-visible:rounded-lg" aria-label="MindStormer Global Academy Home">
        <div class="w-10 h-10 bg-[#0F172A] rounded-xl flex items-center justify-center text-white font-black text-base border border-slate-700 shadow-sm">MS</div>
        <span class="font-black text-base text-[#0F172A] font-heading">MAYND STORMIR <span class="text-[#047857]">GUARDIAN PORTAL</span></span>
      </a>
      <a href="login.html" class="text-xs font-semibold text-slate-700 hover:text-[#1D4ED8] transition-colors focus-visible:rounded px-2 py-1">Student Login →</a>
    </div>
  </header>

  <!-- Login Main Container Landmark -->
  <main role="main" class="flex-1 flex items-center justify-center p-4 py-8">
    <div class="msa-parent-card card-enterprise w-full max-w-md bg-white rounded-2xl p-8">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-emerald-50 text-[#047857] rounded-xl font-bold mb-3 shadow-sm" aria-hidden="true">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <h1 class="text-2xl font-black text-[#0F172A] tracking-tight font-heading">Guardian Portal Login</h1>
        <p class="text-xs font-medium text-slate-600 mt-1">Sign in to review verified academic performance and continuous assessment metrics</p>
      </div>

      <form action="parent-dashboard.html" method="get" id="login" class="space-y-4 msa-parent-form" novalidate>
        <div>
          <label for="username">Guardian Username or Email</label>
          <input type="text" id="username" name="username" value="parent_g2" placeholder="e.g. parent_g2" autocomplete="username" required aria-required="true">
        </div>

        <div class="relative">
          <label for="password">Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" value="Stormer@2026" placeholder="••••••••" autocomplete="current-password" required aria-required="true" class="pr-11">
            <button type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false" class="absolute right-3 top-[10px] text-slate-500 hover:text-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 rounded-lg p-1.5 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginbtn" class="w-full btn-enterprise-emerald text-white font-bold py-3.5 rounded-lg text-sm uppercase tracking-wider mt-2 cursor-pointer">
          Access Guardian Portal
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-xs font-semibold text-slate-600">
        <div><a href="#" class="text-slate-600 hover:text-slate-900 hover:underline focus-visible:rounded px-1">Forgot password?</a></div>
        <div><a href="parent-signup.html" class="text-[#047857] hover:text-[#065F46] hover:underline focus-visible:rounded px-1">Register Guardian Account</a></div>
      </div>
    </div>
  </main>

  <footer role="contentinfo" class="bg-[#0F172A] text-slate-400 text-center text-xs py-4 border-t border-slate-800">
    © 2026 Maynd Stormir Inc. All rights reserved.
  </footer>

  <script src="assets/js/form-validation.js" defer></script>
</body>
</html>
