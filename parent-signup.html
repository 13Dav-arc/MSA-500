<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Parent Account | MindStormer Global Academy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { heading: ['Plus Jakarta Sans', 'sans-serif'], body: ['Inter', 'sans-serif'] },
          colors: { msa: { navy: '#0F172A', royal: '#1E3A8A', blue: '#2563EB', emerald: '#10B981', amber: '#F59E0B' } }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; }
    .btn-3d-emerald { background-color: #059669; box-shadow: 0 4px 0 #047857; transition: all 0.2s ease; }
    .btn-3d-emerald:hover { background-color: #047857; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(5,150,105,0.3), 0 4px 0 #065F46; }
    .btn-3d-emerald:active { transform: translateY(2px); box-shadow: 0 2px 0 #065F46; }
    .card-tactile { background: #FFFFFF; border: 2px solid #E2E8F0; border-bottom-width: 5px; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <header class="bg-white border-b-2 border-slate-100 py-4 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-msa-navy to-blue-900 rounded-xl flex items-center justify-center text-white font-black text-lg border border-blue-500/20">MS</div>
        <span class="font-black text-base text-msa-navy">MAYND STORMIR <span class="text-emerald-600">GUARDIAN PORTAL</span></span>
      </a>
      <a href="parent-login.html" class="text-xs font-bold text-slate-600 hover:text-emerald-600 transition-colors">Already registered? Log in →</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-lg card-tactile rounded-2xl p-8 shadow-xl">
      <div class="text-center mb-8">
        <div class="inline-flex p-3 bg-emerald-50 text-emerald-600 rounded-xl font-bold text-2xl mb-3">🛡️</div>
        <h1 class="text-2xl font-black text-msa-navy">Register Guardian Account</h1>
        <p class="text-xs font-semibold text-slate-500 mt-1">Link your account to track your child's continuous assessments</p>
      </div>

      <form action="parent-dashboard.html" method="GET" class="space-y-4">
        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Full Name</label>
          <input type="text" required placeholder="e.g. Mr. O. Olamiposi" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-800 focus:border-emerald-600 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Guardian Email Address</label>
          <input type="email" required placeholder="parent@mindstormer.com" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-800 focus:border-emerald-600 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Link Student ID</label>
          <input type="text" required placeholder="Enter student code (e.g. STU-2026-8812)" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-800 focus:border-emerald-600 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Password</label>
          <input type="password" required placeholder="Minimum 8 characters" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-800 focus:border-emerald-600 focus:outline-none">
        </div>

        <button type="submit" class="w-full btn-3d-emerald text-white font-black py-3.5 rounded-xl text-sm uppercase tracking-wider mt-2">
          Create Guardian Account 🛡️
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs font-bold text-slate-500">
        Student Account? <a href="signup.html" class="text-msa-blue hover:underline">Register Student Account</a>
      </div>
    </div>
  </main>

  <footer class="bg-slate-900 text-slate-500 text-center text-xs py-4">
    © 2026 Maynd Stormir Inc. All rights reserved.
  </footer>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
